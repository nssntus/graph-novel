<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创建新书 — 番茄小说工坊</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1><a href="/">📖 番茄小说工坊</a></h1>
  <nav>
    <a href="/">项目列表</a>
    <a href="/create" class="active">创建新书</a>
  </nav>
</header>

<div class="container">
  <h2 style="font-weight: normal; font-size: 1.5rem; margin-bottom: 1rem;">创建新书</h2>
  <p class="muted mb-2" style="font-size:0.85rem">
    🍅 针对番茄小说优化：黄金三章 + 爽点排期 + 章末钩子 + AI病检测 + 算法适配评估
  </p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label for="title">书名 *</label>
        <input type="text" id="title" name="title" required
               placeholder="如：重生之都市修仙、开局签到SSS级天赋">
      </div>

      <div class="form-group">
        <label for="genre">题材（番茄分类）</label>
        <select id="genre" name="genre">
          <option value="都市脑洞">🔥 都市脑洞（流量天花板）</option>
          <option value="都市高武">⚔️ 都市高武/异能</option>
          <option value="年代重生">🔄 年代重生/搞钱</option>
          <option value="玄幻脑洞">🌌 玄幻脑洞</option>
          <option value="战神赘婿">👑 战神/赘婿逆袭</option>
          <option value="快穿大女主">👸 快穿大女主</option>
          <option value="悬疑无限流">🔍 悬疑无限流/规则怪谈</option>
          <option value="系统爽文">🎮 系统流爽文</option>
          <option value="都市修真">☯️ 都市修真</option>
          <option value="甜宠短篇">💕 甜宠短篇</option>
          <option value="其他">📝 其他</option>
        </select>
      </div>

      <div class="form-group">
        <label for="genre_tags">标签（逗号分隔，如：系统流,重生,扮猪吃虎,爽文）</label>
        <input type="text" id="genre_tags" name="genre_tags"
               placeholder="系统流, 重生, 扮猪吃虎, 脑洞">
      </div>

      <div class="form-group">
        <label for="premise">一句话卖点（番茄式的钩子，让人一看就想点）</label>
        <input type="text" id="premise" name="premise"
               placeholder="如：重生2008年，绑定神豪系统，花钱就能变强——我要买下整个世界。">
      </div>

      <div class="form-group">
        <label for="theme">核心爽点方向</label>
        <input type="text" id="theme" name="theme"
               placeholder="如：逆袭打脸、扮猪吃虎、信息差碾压、系统养成暴富">
      </div>

      <div class="grid grid-2">
        <div class="form-group">
          <label for="target_chapters">目标章数</label>
          <input type="number" id="target_chapters" name="target_chapters"
                 value="30" min="5" max="200">
          <span class="muted">建议 30-50 章起步</span>
        </div>

        <div class="form-group">
          <label for="target_words">目标总字数</label>
          <input type="number" id="target_words" name="target_words"
                 value="500000" min="50000" max="5000000" step="10000">
          <span class="muted">番茄短篇 5-20 万字，长篇 50 万+</span>
        </div>
      </div>

      <div class="form-group">
        <label for="notes">创作方向 / 额外设定（可选）</label>
        <textarea id="notes" name="notes" rows="4"
                  placeholder="比如：主角是外卖小哥获雷劈后觉醒透视异能、女主重生70年代靠空间囤货暴富……越具体越好。"></textarea>
      </div>

      <div class="flex gap-1 mt-2">
        <button type="submit" class="btn btn-primary">🚀 创建并开始 Foundation</button>
        <a href="/" class="btn">取消</a>
      </div>
    </form>
  </div>
</div>
<script src="/static/chat.js"></script>
</body>
</html>
